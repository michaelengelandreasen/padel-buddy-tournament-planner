name: padel-tournament-planner
services:
  app:
    build: .
    restart: unless-stopped
    # Runs as the project owner so the SQLite file it writes into the bind
    # mount belongs to us, not to root.
    user: "1000:1000"
    working_dir: /app
    environment:
      PORT: "8080"
      DB_PATH: /app/data/planner.db
      # The club's own clock. "Is this date in the past" and "which Friday is
      # next" are questions about an evening in Matosinhos, not about UTC.
      TZ: Europe/Lisbon
      # Which group chats the bot posts to. Left unset it works this out on its
      # own: the WhatsApp draft outbox always, plus Telegram if a bot token
      # exists. See src/messaging/transport.js.
      # MESSAGING_CHANNELS: draft telegram
      #
      # From @BotFather. With it set, the bot joins the club's Telegram group,
      # answers commands there and posts the rounds by itself; without it the
      # club stays on the paste-it-yourself outbox. Which group is learned from
      # the first command the bot sees, so there is nothing else to configure.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # The console's one shared login (HTTP Basic), the same on the VPN and the
      # public URL. Share it inside the link: https://padel:buddy@host/ — no
      # accounts, no reset flow, the browser remembers it. Empty disables it.
      BASIC_AUTH: ${BASIC_AUTH:-padel:buddy}
    networks: [web, internal]
    volumes:
      # Absolute host paths: the broker only permits binds under the real
      # projects volume, and ./ resolves through a symlink it doesn't accept.
      - ${PROJECTS_DIR}/padel-tournament-planner/src:/app/src
      - ${PROJECTS_DIR}/padel-tournament-planner/scripts:/app/scripts
      - ${PROJECTS_DIR}/padel-tournament-planner/test:/app/test
      - ${PROJECTS_DIR}/padel-tournament-planner/data:/app/data
    labels:
      # The dashboard at mikehome.users.ctx7.dev lists containers carrying this
      # label. The broker stamps it when the agent creates a container; a
      # `docker compose up` run on the host does not, and the project silently
      # disappears from the dashboard. Declared here so it survives recreation.
      - aidevserver.project=true
      - traefik.enable=true
      - 'traefik.http.routers.padel-tournament-planner.rule=Host(`padel-tournament-planner.mikehome.users.ctx7.dev`)'
      - traefik.http.routers.padel-tournament-planner.entrypoints=websecure
      - traefik.http.routers.padel-tournament-planner.tls=true
      - traefik.http.routers.padel-tournament-planner.tls.certresolver=cloudflare
      - 'traefik.http.routers.padel-tournament-planner.tls.domains[0].main=mikehome.users.ctx7.dev'
      - 'traefik.http.routers.padel-tournament-planner.tls.domains[0].sans=*.mikehome.users.ctx7.dev'
      - traefik.http.services.padel-tournament-planner.loadbalancer.server.port=8080

  # Public entry on the club's own domain, through a Cloudflare Tunnel.
  #
  # The stack keeps projects VPN-only, Traefik cannot issue a certificate for a
  # name outside the ctx7 wildcard, and the home router's 443/80 already belong
  # to its own nginx — so nothing here can answer the public internet directly.
  # cloudflared dials out instead: Cloudflare terminates TLS at its edge and
  # hands requests to this container over the outbound tunnel, which reaches the
  # app on the compose network as http://app:8080. No port, no cert, no router
  # change. The public hostname and its target are set in Cloudflare Zero Trust
  # (Networks → Tunnels → Public Hostname); the token in .env is the whole
  # configuration on this side.
  #
  # Behind the `public` profile so a bare `docker compose up` on a box without
  # a token does not leave a crash-looping container. Enable it once in .env:
  #   TUNNEL_TOKEN=eyJ…
  #   COMPOSE_PROFILES=public
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    depends_on: [app]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    # Only the private network. On the shared `web` network four other projects
    # also have a service called `app`, and Docker's DNS round-robins between
    # them — so `http://app:8080` from here would reach somebody else's
    # container one request in five. Here `app` can only mean ours.
    networks: [internal]

networks:
  web: { external: true }
  # Project-private, so service names resolve to this project alone.
  internal: {}
