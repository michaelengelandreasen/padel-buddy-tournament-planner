# Tuned for the current host: 4 cores / 8 threads, 32 GB RAM.
# The previous values (-Xmx1024m, parallel=false) were survival settings for a
# 2-core / 3.8 GB box, where anything larger was silently OOM-killed.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=6
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
kotlin.code.style=official
